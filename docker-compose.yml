services:
  backend:
    build: ./backend
    container_name: utah_wildfire_backend
    expose:
      - "8000"
    environment:
      - NWS_USER_AGENT=${NWS_USER_AGENT:-UtahWildfireTracker/1.0 (contact@example.com)}
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS:-*}
    volumes:
      - municipal_data:/app/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3).close()"]
      interval: 30s
      timeout: 5s
      start_period: 90s
      retries: 3
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: utah_wildfire_frontend
    ports:
      - "8080:80"
    environment:
      - PRODUCTION_DOMAIN=${PRODUCTION_DOMAIN:-_}
      - CARTO_API_KEY=${CARTO_API_KEY:-}
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  municipal_data:
