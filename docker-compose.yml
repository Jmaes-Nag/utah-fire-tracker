version: '3.8'

services:
  backend:
    build: ./backend
    container_name: utah_wildfire_backend
    expose:
      - "8000"
    environment:
      - NWS_USER_AGENT=UtahWildfireTracker/1.0 (contact@example.com)
      - ALLOWED_ORIGINS=${ALLOWED_ORIGINS}
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: utah_wildfire_frontend
    ports:
      - "8080:80"
    environment:
      - PRODUCTION_DOMAIN=${PRODUCTION_DOMAIN:-_}
      - CARTO_API_KEY=${CARTO_API_KEY:-}
    depends_on:
      - backend
    restart: unless-stopped
