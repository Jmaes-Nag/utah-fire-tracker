version: '3.8'

services:
  backend:
    build: ./backend
    container_name: utah_wildfire_backend
    expose:
      - "8000"
    environment:
      - NWS_USER_AGENT=UtahWildfireTracker/1.0 (contact@example.com)
    restart: unless-stopped

  frontend:
    build: ./frontend
    container_name: utah_wildfire_frontend
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped
